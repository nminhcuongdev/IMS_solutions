name: ims

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "${DB_PORT:-14333}:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: ./Backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Ims: "Server=db,1433;Database=Ims;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env (64+ random characters)}
      Database__AutoMigrate: "true"
      Cors__AllowPrivateNetwork: "true"
    ports:
      - "${API_PORT:-8091}:8080"

  web:
    build:
      context: ./Frontend
      args:
        VITE_API_PORT: ${API_PORT:-8091}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8090}:80"

volumes:
  db-data:
