[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
lifecycle = "2.8.7"
navigation = "2.8.4"
retrofit = "2.11.0"
okhttp = "4.12.0"
serialization = "1.7.3"
retrofitSerialization = "1.0.0"
datastore = "1.1.1"
junit = "4.13.2"

[libraries]
androidx-core-ktx           = { group = "androidx.core",      name = "core-ktx",            version.ref = "coreKtx" }
androidx-activity-compose   = { group = "androidx.activity",  name = "activity-compose",    version.ref = "activityCompose" }
androidx-compose-bom        = { group = "androidx.compose",   name = "compose-bom",         version.ref = "composeBom" }
androidx-ui                 = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics        = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling         = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3          = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons     = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-lifecycle-runtime  = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",        version.ref = "lifecycle" }
androidx-lifecycle-vm       = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose",  version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose",         version.ref = "navigation" }
androidx-datastore          = { group = "androidx.datastore", name = "datastore-preferences",       version.ref = "datastore" }
retrofit                    = { group = "com.squareup.retrofit2", name = "retrofit",                version.ref = "retrofit" }
okhttp-logging              = { group = "com.squareup.okhttp3",   name = "logging-interceptor",     version.ref = "okhttp" }
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx",  name = "kotlinx-serialization-json", version.ref = "serialization" }
junit                       = { group = "junit", name = "junit", version.ref = "junit" }
retrofit-serialization      = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerialization" }

[plugins]
android-application = { id = "com.android.application",              version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
